
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Video Replacement Demo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff4e1;
      font-family: Arial, Helvetica, sans-serif;
      color: #75462f;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 22px;
    }

    .comparison-row {
      display: grid;
      grid-template-columns:
        165px
        minmax(0, 1fr)
        50px
        minmax(0, 1fr)
        50px
        minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      margin-bottom: 70px;
    }

    .row-label {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.55;
      overflow-wrap: break-word;
    }

    .media {
      width: 100%;
      min-width: 0;
      height: 245px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .media img,
    .media video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .lamp img {
      mix-blend-mode: multiply;
    }

    .operator {
      color: #ff9252;
      font-size: 70px;
      font-weight: 600;
      text-align: center;
      line-height: 1;
    }

    video {
      background: transparent;
      cursor: pointer;
    }

    @media (max-width: 800px) {
      .container {
        padding: 24px 12px;
      }

      .comparison-row {
        grid-template-columns:
          minmax(0, 1fr)
          24px
          minmax(0, 1fr)
          24px
          minmax(0, 1fr);
        gap: 5px;
        margin-bottom: 45px;
      }

      .row-label {
        grid-column: 1 / -1;
        font-size: 20px;
        margin-bottom: 12px;
      }

      .media {
        height: auto;
        aspect-ratio: 3 / 4;
      }

      .operator {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <!-- Row 1: Individual Item Replacement -->
    <section class="comparison-row">

      <div class="row-label">
        Individual<br>
        Item<br>
        Replacement
      </div>

      <div class="media lamp">
        <img src="lamp.png"
             alt="Lamp reference">
      </div>

      <div class="operator">+</div>

      <div class="media">
        <img src="p1.PNG"
             alt="Original room">
      </div>

      <div class="operator">=</div>

      <div class="media">
        <video controls
               playsinline
               preload="metadata">
          <source src="V1.MP4"
                  type="video/mp4">
          Your browser does not support video.
        </video>
      </div>

    </section>

    <!-- Row 2: Style Replacement -->
    <section class="comparison-row">

      <div class="row-label">
        Style<br>
        Replacement
      </div>

      <div class="media">
        <img src="p2.png"
             alt="Style reference">
      </div>

      <div class="operator">+</div>

      <div class="media">
        <img src="p3.JPG"
             alt="Original room">
      </div>

      <div class="operator">=</div>

      <div class="media">
        <video controls
               playsinline
               preload="metadata">
          <source src="v2.MP4"
                  type="video/mp4">
          Your browser does not support video.
        </video>
      </div>

    </section>

  </main>
</body>
</html>
